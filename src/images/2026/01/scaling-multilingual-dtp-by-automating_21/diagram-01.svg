<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Mandatory text check from PDF folder to log results</title>
  <desc id="desc">PDFs are checked against the sample mandatory strings, then the log records an OK result or an NG result with missing text.</desc>
  <style>
    svg { --bg:#f8f7f3; --fg:#242522; --muted:#666962; --line:#d8d8d1; --accent:#225f77; --warn:#a4462f; }
    @media (prefers-color-scheme: dark) { svg { --bg:#161816; --fg:#e8e9e4; --muted:#adafa8; --line:#3b3e39; --accent:#82c7df; --warn:#e08a70; } }
    .label { font: 700 34px system-ui, -apple-system, "Segoe UI", sans-serif; fill:var(--fg) }
    .small { font: 32px system-ui, -apple-system, "Segoe UI", sans-serif; fill:var(--fg) }
    .note { font: 30px system-ui, -apple-system, "Segoe UI", sans-serif; fill:var(--warn) }
    .mono { font: 30px ui-monospace, Consolas, monospace; fill:var(--fg) }
    .box { fill:none; stroke:var(--line); stroke-width:4 }
    .flow { stroke:var(--accent); stroke-width:7; fill:none }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--accent)"/></marker></defs>
  <rect width="1600" height="900" fill="var(--bg)"/>
  <rect x="55" y="145" width="390" height="500" rx="18" class="box"/>
  <text x="250" y="215" text-anchor="middle" class="label">PDF folder</text>
  <text x="250" y="300" text-anchor="middle" class="small">Extract text</text>
  <text x="250" y="365" text-anchor="middle" class="small">from each PDF</text>
  <text x="250" y="525" text-anchor="middle" class="small">Report which PDFs</text>
  <text x="250" y="575" text-anchor="middle" class="small">pass or fail</text>
  <path d="M445 395H570" class="flow" marker-end="url(#arrow)"/>
  <rect x="570" y="95" width="460" height="600" rx="18" class="box"/>
  <text x="800" y="165" text-anchor="middle" class="label">Mandatory strings</text>
  <text x="800" y="245" text-anchor="middle" class="mono">Warning</text>
  <text x="800" y="315" text-anchor="middle" class="mono">Intended Use</text>
  <text x="800" y="385" text-anchor="middle" class="mono">Copyright</text>
  <text x="800" y="455" text-anchor="middle" class="mono">1234-5678A</text>
  <text x="800" y="565" text-anchor="middle" class="small">Search the predefined list</text>
  <text x="800" y="620" text-anchor="middle" class="small">in each PDF</text>
  <path d="M1030 395H1155" class="flow" marker-end="url(#arrow)"/>
  <rect x="1155" y="145" width="390" height="500" rx="18" class="box"/>
  <text x="1350" y="215" text-anchor="middle" class="label">Log file</text>
  <text x="1195" y="305" class="mono">{pdf.name}: OK</text>
  <text x="1195" y="410" class="mono">{pdf.name}: NG</text>
  <text x="1195" y="460" class="mono">Missing:</text>
  <text x="1195" y="510" class="mono">['Intended Use']</text>
  <text x="1350" y="590" text-anchor="middle" class="small">Saved for traceability</text>
  <text x="800" y="790" text-anchor="middle" class="label">A fast, repeatable safety net before delivery</text>
  <text x="800" y="845" text-anchor="middle" class="note">This does not replace full QA</text>
</svg>
